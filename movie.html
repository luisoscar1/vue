<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Película</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 15px;
        }

        .rating-section {
            margin-top: 20px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            font-size: 16px;
            margin-right: 10px;
        }

        button {
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="card">
            <h1>{{ pelicula.title }}</h1>
            <p>{{ pelicula.overview }}</p>
            <img :src="'http://image.tmdb.org/t/p/w500' + pelicula.poster_path" alt="Poster de la Película">

            <!-- Sección para añadir rating -->
            <div class="rating-section">
                <label for="rating">Añadir Rating:</label>
                <input type="number" v-model="rating" id="rating" min="1" max="10" step="0.1">
                <button @click="submitRating">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    pelicula: JSON.parse(localStorage.getItem('movie')) || {},
                    rating: 0  // Variable para almacenar el rating
                };
            },
            methods: {
                submitRating() {
                    if (this.rating > 0 && this.rating <= 10) {
                        const myHeaders = new Headers();
                        myHeaders.append("Content-Type", "application/json");
                        myHeaders.append("Authorization", "Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI5NzBlZDg0NmIwZTFmYmJkMjQxOWEwOGZiMzU0YTc0ZiIsIm5iZiI6MTcyODU4OTI3MC40NDM5NzQsInN1YiI6IjY3MDc5ODU2NjcxODAxMmZjMjMzYTdhZCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.i1N5Be5KepwVOIT7aKuOm5wNdOC1T3aas20ioyhy78U");

                        const sessionId=localStorage.getItem("guestSessionId")
                        const raw = JSON.stringify({
                            value: this.rating
                        });
                        console.log(sessionId)
                         console.log(this.rating)
                         console.log(this.pelicula.id)

                        const requestOptions = {
                            method: 'POST',
                            headers: myHeaders,
                            body: raw,
                            redirect: 'follow'
                        };

                        fetch(`https://api.themoviedb.org/3/movie/${this.pelicula.id}/rating?guest_session_id=${sessionId}`, requestOptions)
                            .then(response => response.json())
                            .then(result => {
                                console.log(result);
                                if (result.success) {
                                    alert("Rating enviado con éxito");
                                } else {
                                    alert("Hubo un error al enviar el rating");
                                }
                            })
                            .catch(error => console.log('error', error));
                    } else {

                        alert("El rating debe estar entre 1 y 10");
                    }
                    

                }
            }
        }).mount('#app');
    </script>
</body>

</html>
