<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Acceso</title>
	<style type="text/css">
		.form_cointainer {
			width: 60%;
			margin: auto;
			margin-top: 50px;
		}
	</style>
</head>

<body>

	<fieldset class="form_cointainer" id="main">
		<legend>Acceso</legend>

		<form @submit.prevent="login">

			<label>Email</label>
			<input type="text" v-model="email" name="email">

			<label>Password</label>
			<input type="password" v-model="password" name="password">

			<button type="submit">Acceder</button>
		</form>
	</fieldset>

	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script>
		const { createApp, ref } = Vue

		createApp({
			setup() {
				const email = ref('');
				const password = ref('');
				const is_log = ref(false);

				return {
					email,
					password,
					is_log
				}
			},
			methods: {
				async login() {
					try {
						const myHeaders = new Headers();
						myHeaders.append("Content-Type", "application/json");
						myHeaders.append("Authorization", "Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzN2IxMDAyZjFjYmY3N2JkMTg1ZDg3NDkyMmFlZWU3MCIsInN1YiI6IjY1MTRiNzhlYmRkNTY4MDEzZjU4MzBjOSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.OX11ObYS13YEQravRhAAKDfzpifakVGHdTnmxJ3rEeo");

						const loginPayload = JSON.stringify({
							"username": this.email,
							"password": this.password,
							"request_token": ""
						});

						const requestOptions = {
							method: "POST",
							headers: myHeaders,
							body: loginPayload,
							redirect: "follow"
						};

						// Validar login
						const response = await fetch("https://api.themoviedb.org/3/authentication/token/validate_with_login", requestOptions);
						const result = await response.json();

						if (result.success) {
							this.is_log = true;
							localStorage.setItem("is_log", this.is_log);
							localStorage.setItem("username", this.email);
							alert("Login exitoso");

							// Generar guest session ID
							const guestSessionResponse = await fetch("https://api.themoviedb.org/3/authentication/guest_session/new?api_key=970ed846b0e1fbbd2419a08fb354a74f", { method: 'GET' });
							const guestSessionResult = await guestSessionResponse.json();

							if (guestSessionResult.success) {
								// Guardar guest session ID en localStorage
								localStorage.setItem("guestSessionId", guestSessionResult.guest_session_id);
								window.location.href = "movies.html";  // Redirigir después del login
							} else {
								alert("Error al generar guest session ID.");
							}
						} else {
							alert("Usuario o contraseña incorrectos.");
						}
					} catch (error) {
						console.error('Error:', error);
						alert("Ocurrió un error durante el login.");
					}
				}
			},
			mounted() {
				// Verificar si ya hay una sesión iniciada
				let is_log = localStorage.getItem("is_log");
				let username = localStorage.getItem("username");

				if (is_log != null && username != null) {
					window.location.href = "movies.html";
				}
			}
		}).mount('#main');
	</script>
</body>

</html>
